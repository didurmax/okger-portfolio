# Назву app замініть на назву вашого застосунку на fly.io (або залиште — fly створить новий)
app = "okger-portfolio"
primary_region = "fra"
swap_size_mb = 512

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Боти мають працювати постійно, тому машина не засинає
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
